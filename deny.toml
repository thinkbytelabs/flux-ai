# cargo-deny: license, advisory, and source policy. Run: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # unsafe-libyaml is unmaintained (archived), not vulnerable. Pulled in by
    # serde_yaml_ng, Flux's YAML parser; migrating the parser is tracked work.
    { id = "RUSTSEC-2024-0449", reason = "unmaintained, no known vulnerability; YAML parser migration pending" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
