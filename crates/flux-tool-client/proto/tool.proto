syntax = "proto3";
package flux.tool.v1;

service ToolService {
  rpc ListTools(ListToolsRequest) returns (Manifest);
  rpc CallTool(CallToolRequest) returns (CallToolResponse);
}

message ListToolsRequest {}

message Manifest {
  repeated ToolSpec tools = 1;
}

message ToolSpec {
  string name = 1;
  string description = 2;
  string parameters_json = 3; // JSON-schema, serialized
}

message CallToolRequest {
  string name = 1;
  string args_json = 2; // JSON object, serialized
  string context_json = 3; // request-scoped context JSON object, serialized; empty if none
}

message CallToolResponse {
  string result_json = 1; // JSON value, serialized
}
