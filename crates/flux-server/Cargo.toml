flux-settings.workspace = true
flux-llm.workspace = true
flux-runner.workspace = true
flux-orchestrator.workspace = true
flux-workflow.workspace = true
flux-session.workspace = true
flux-memory.workspace = true
flux-tool-client.workspace = true
axum.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
uuid = { workspace = true, features = ["v4"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
serde_yaml_ng = { workspace = true }
