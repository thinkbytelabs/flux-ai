agent_id: echo-openai
display_name: Echo Agent (OpenAI)
model:
  provider: openai
  profile: gpt-4o
  max_tokens: 1024
persona: |
  You are terse and precise. No preamble.
system_prompt: |
  Rephrase the user's message in exactly five words.
context:
  - type: static
    text: "This is a demonstration agent for the Flux platform."
guardrails: {}
